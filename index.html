const td=()=>new Date().toLocaleDateString('en-CA');
const fm=n=>'RD$ '+Number(n||0).toLocaleString('es-DO');
const nz=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
const nb=()=>({kind:'Factura',client:'',pay:'Efectivo',paid:'',notes:'',lines:[],source_order_id:null,source_order_paid:0});
const clientLabel=c=>`${c.name}${c.phone?' — '+c.phone:''}`;
const resolveClient=value=>{const raw=String(value||'').trim();if(!raw)return null;const exact=D.c.find(c=>clientLabel(c)===raw);if(exact)return exact;const matches=D.c.filter(c=>nz(c.name)===nz(raw));return matches.length===1?matches[0]:null};
const catalogLabel=s=>`${s.name} · ${s.item_type||'Producto'}`;
const findCatalogItem=value=>{const raw=String(value||'').trim();return D.s.find(s=>catalogLabel(s)===raw)||D.s.find(s=>s.name===raw)||D.s.find(s=>nz(s.name)===nz(raw))||null};
const orderText=o=>{const p=String(o?.problem||'').trim(),d=String(o?.diagnosis||'').trim();return [p,d&&p?'Diagnóstico y trabajo realizado:\n'+d:d].filter(Boolean).join('\n\n')};
const accessoryText=o=>[['Bulto',o.accessory_bag],['Correa',o.accessory_strap],['Púa',o.accessory_pick],['Palanca',o.accessory_tremolo_bar],['Capotraste',o.accessory_capo]].map(([n,v])=>n+': '+(v?'Sí':'No')).join(' · ');
let me=null,perms=[],D={c:[],o:[],p:[],s:[],sc:[],x:[],t:[],pf:[],u:[],rp:[],iv:[],ii:[],ip:[],ca:[],oi:[],ph:[],mf:[],mc:[],techs:[],te:[],tp:[],tpi:[]},vw='panel',fl='Todas',Q={c:'',s:''},FS,RC,B=nb(),OFORM=null,OLINES=[],MCONTACT_ID=null;
let cashFrom=td().slice(0,8)+'01',cashTo=td(),techPeriod='week',techFrom=td().slice(0,8)+'01',techTo=td();
const can=m=>!!me&&(m==='pagosTecnicos'?(me.id===TECH_YEISON||me.id===TECH_NANDO):(me.role=='Administrador'||perms.includes(m)));
const mo=()=>can('$');
const roles=()=>[...new Set(D.rp.map(x=>x.role))];
const cl=id=>D.c.find(c=>c.id==id)||{name:'Sin cliente',phone:'',address:''};
const pd=o=>D.p.filter(p=>p.order_id==o.id).reduce((a,p)=>a+ +p.amount,0);
const sum=a=>a.reduce((x,y)=>x+ +y.amount,0);
const ivT=i=>D.ii.filter(x=>x.invoice_id==i.id).reduce((a,x)=>a+x.qty*x.unit_price,0);
const linkedInvoice=o=>D.iv.find(i=>i.kind==='Factura'&&i.source_order_id==o.id)||null;
const orderBalance=o=>linkedInvoice(o)?0:Math.max(Number(o.agreed_amount||0)-pd(o),0);
const invoiceBalance=i=>Math.max(ivT(i)-Number(i.paid_amount||0),0);
const billTotal=()=>B.lines.reduce((n,l)=>n+Number(l.qty||0)*Number(l.unit_price||0),0);
const billCredit=()=>Math.min(Math.max(0,Number(B.source_order_paid||0)),billTotal());
const billDue=()=>Math.max(billTotal()-billCredit(),0);
