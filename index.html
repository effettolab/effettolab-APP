<style>
:root{--bg:#e9ece8;--sf:#f8f9f7;--tx:#15201e;--mu:#5d6a67;--bd:#cdd5d1;--ac:#0c6a62;--ak:#fff;--ok:#1f7a4a;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1413;--sf:#172120;--tx:#e6efec;--mu:#93a39f;--bd:#2a3836;--ac:#45d1c0;--ak:#06201c;--ok:#5fc28a;--er:#ff7b72}}
:root[data-theme="dark"]{--bg:#0e1413;--sf:#172120;--tx:#e6efec;--mu:#93a39f;--bd:#2a3836;--ac:#45d1c0;--ak:#06201c;--ok:#5fc28a;--er:#ff7b72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Barlow,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
h2,h3,.n,.s b,.ch b{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;letter-spacing:.02em}
h2{margin:0;font-size:26px}h3{margin:14px 0 8px;font-size:20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;display:flex;gap:12px;align-items:center;padding:10px max(14px,calc((100% - 1120px)/2));background:var(--sf);border-bottom:1px solid var(--bd)}
header .n{flex:1;font-size:22px;line-height:1.05}
.brand{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#fff;flex:0 0 auto}
.brandline{display:flex;flex-direction:column;gap:2px;min-width:0}
.brandline small{font-size:11px;color:var(--mu);font-weight:600;letter-spacing:.08em}
main{max-width:1120px;margin:0 auto;padding:18px 14px 28px}
nav{position:sticky;top:calc(68px + env(safe-area-inset-top,0px));z-index:11;display:flex;overflow-x:auto;gap:4px;background:var(--sf);border-bottom:1px solid var(--bd);box-shadow:0 3px 12px rgba(15,30,26,.06);padding:8px max(8px,calc((100% - 1120px)/2))}
nav button{flex:0 0 auto;min-width:96px;background:none;border:0;border-radius:7px;padding:11px 13px;font-size:14px;color:var(--mu);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--ac);font-weight:700;border-bottom-color:var(--ac)}
@media(max-width:560px){header{gap:8px;padding:9px 10px}.brand{width:40px;height:40px}header .n{font-size:18px}nav{top:calc(58px + env(safe-area-inset-top,0px));padding:6px 8px}nav button{min-width:88px;padding:10px 11px;font-size:13px}main{padding:14px 10px 24px}}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:12px;margin-bottom:10px}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.g1{flex:1}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.s{margin:0}.s b{display:block;font-size:30px;line-height:1.1}.s span,.m{color:var(--mu);font-size:13px}
.m{display:flex;gap:12px;flex-wrap:wrap}
.b{background:var(--ac);color:var(--ak);border:0;border-radius:4px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:14px}
.b.o{background:none;color:var(--ac);border:1px solid var(--bd)}.b:disabled{opacity:.5}
.t{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.t.l{color:var(--ok);border-color:var(--ok)}.er{color:var(--er)}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin-top:8px}
.ch{display:flex;overflow-x:auto;margin:12px 0 14px;padding-bottom:4px}
.ch div{flex:1;min-width:88px;text-align:center;padding:10px 4px;background:var(--sf);border:1px solid var(--bd);border-radius:6px;position:relative}
.ch div+div{margin-left:16px}.ch div+div::before{content:"";position:absolute;left:-17px;top:50%;width:16px;border-top:2px solid var(--bd)}
.ch i{display:block;width:10px;height:10px;border-radius:50%;margin:0 auto 6px;background:var(--bd)}
.ch .on i{background:var(--ac);box-shadow:0 0 9px var(--ac)}
.ch b{display:block;font-size:26px;line-height:1.1}.ch span{font-size:12px;color:var(--mu)}
#m{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
#m.on{display:flex}
#m>div{background:var(--sf);width:min(520px,100%);max-height:88vh;overflow:auto;border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:6px;z-index:30;display:none;max-width:90%}
#t.on{display:block}

.order-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.order-grid .full{grid-column:1/-1}
.order-grid label,.order-catalog label{margin-top:5px}
.order-grid input,.order-grid select,.order-grid textarea{padding:7px;font-size:14px}
.order-grid .compact textarea{resize:vertical}
.accessory-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}
.accessory-grid>div{padding:8px;border:1px solid var(--bd);border-radius:5px}
.accessory-grid label{margin:0 0 4px}
.catalog-line{padding:9px;margin:8px 0}
.photo-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photo-strip a{display:block;width:88px;color:var(--ac);font-size:11px;text-decoration:none;overflow-wrap:anywhere}
.photo-strip img{display:block;width:88px;height:72px;object-fit:cover;border:1px solid var(--bd);border-radius:5px;background:var(--bg)}
.maint-status{display:inline-block;padding:3px 8px;border:1px solid var(--bd);border-radius:99px;font-size:12px;font-weight:700}.maint-status.overdue{color:var(--er);border-color:var(--er)}.maint-status.today{color:#9a6500;border-color:#c99b3b}.maint-status.upcoming{color:var(--ok);border-color:var(--ok)}.doc-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.doc-actions .b{font-size:12px;padding:7px 9px}.el-order-search{margin:10px 0 14px}.el-order-search input{min-height:44px}
@media(max-width:560px){.order-grid{grid-template-columns:1fr}.order-grid .full{grid-column:auto}.photo-strip a,.photo-strip img{width:74px}.photo-strip img{height:62px}}

.tech-assign{border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}.tech-choices{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}.tech-choice{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700}.tech-choice input{position:absolute;opacity:0;pointer-events:none}.tech-radio{width:19px;height:19px;border:2px solid var(--mu);border-radius:50%;display:inline-block;position:relative}.tech-choice input:checked+.tech-radio{border-color:var(--ac)}.tech-choice input:checked+.tech-radio:after{content:"";position:absolute;inset:4px;background:var(--ac);border-radius:50%}.tech-amount{margin-top:12px}
.el-notif-button{position:relative;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.el-notif-count{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--er);color:#fff;font-size:11px}
@media(max-width:560px){.el-notif-button span:not(.el-notif-count){display:none}.el-notif-button{padding:8px 10px}}

async function uploadStockPhotos(stockId,files){
 const warnings=[];let uploaded=0;
 for(const file of Array.from(files||[])){
  if(!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type)){warnings.push(file.name+': formato no admitido');continue}
  if(file.size>10*1024*1024){warnings.push(file.name+': supera 10 MB');continue}
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  const token=window.crypto?.randomUUID?crypto.randomUUID():`${Date.now()}_${Math.floor(Math.random()*1000000)}`;
  const path=`${stockId}/${token}.${ext}`;
  const up=await sb.storage.from('stock-photos').upload(path,file,{contentType:file.type,upsert:false});
  if(up.error){warnings.push(file.name+': '+up.error.message);continue}
  const meta=await sb.from('stock_photos').insert({stock_id:stockId,file_path:path,original_name:file.name,mime_type:file.type});
  if(meta.error){await sb.storage.from('stock-photos').remove([path]);warnings.push(file.name+': no se pudo guardar la referencia ('+meta.error.message+')');continue}
  uploaded++;
 }
 return {uploaded,warnings};
}
