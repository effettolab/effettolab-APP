name: Deploy EFFETTO LAB Worker

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker.js"
      - "public/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "public/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effetto-lab-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate Wrangler configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker and static assets (dry run)
        run: npx --yes wrangler@4 deploy --dry-run

  deploy:
    if: github.event_name != 'pull_request'
    name: Publish Worker and static assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
