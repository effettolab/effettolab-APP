name: Deploy EFFETTO LAB Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "public/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effetto-lab-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish Worker and static assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
